<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🎮 Number Guessing Game</h1>
    <p>I have thought of a number between 1 and 100. Can you guess it?</p>

    <input type="number" id="guessInput" placeholder="Type your guess">
    <button onclick="checkGuess()">Submit</button>

    <p id="feedback"></p>
    <p id="attempts"></p>

    <button onclick="restartGame()">Restart Game</button>

    <script src="script.js"></script>
</body>
</html>
